name: Build Agent Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (DEB)
            os: ubuntu-22.04
            triplet: x64-linux
            cpack_gen: DEB
            artifact_glob: "build/*.deb"
            artifact_name: orbis-agent-linux

          - name: macOS Intel (DMG)
            os: macos-13
            triplet: x64-osx
            arch_label: intel
            cpack_gen: DragNDrop
            artifact_glob: "build/*.dmg"
            artifact_name: orbis-agent-macos-intel

          - name: macOS Apple Silicon (DMG)
            os: macos-14
            triplet: arm64-osx
            arch_label: arm64
            cpack_gen: DragNDrop
            artifact_glob: "build/*.dmg"
            artifact_name: orbis-agent-macos-arm64

          - name: Windows (EXE)
            os: windows-2022
            triplet: x64-windows-static
            cpack_gen: NSIS
            artifact_glob: "build/*.exe"
            artifact_name: orbis-agent-windows

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Cache vcpkg built packages (keyed by OS + vcpkg.json hash)
      # -----------------------------------------------------------------------
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      # -----------------------------------------------------------------------
      # 3. System dependencies
      # -----------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl zip unzip tar pkg-config \
            libssl-dev libcurl4-openssl-dev libsqlite3-dev \
            nsis dpkg-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config

      # Windows: cmake, ninja, NSIS are pre-installed on windows-2022 runner

      # -----------------------------------------------------------------------
      # 4. Setup vcpkg
      # -----------------------------------------------------------------------
      - name: Setup vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg" --depth=1
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # -----------------------------------------------------------------------
      # 5. Configure (Linux / macOS)
      # -----------------------------------------------------------------------
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            ${{ matrix.arch_label && format('-DORBIS_ARCH_LABEL={0}', matrix.arch_label) || '' }} \
            -G Ninja

      # -----------------------------------------------------------------------
      # 5. Configure (Windows)
      # -----------------------------------------------------------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -G "Visual Studio 17 2022" -A x64

      # -----------------------------------------------------------------------
      # 6. Build
      # -----------------------------------------------------------------------
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --config Release --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # -----------------------------------------------------------------------
      # 7. Package with CPack
      # -----------------------------------------------------------------------
      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: cpack -G ${{ matrix.cpack_gen }} -C Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        shell: pwsh
        run: cpack -G ${{ matrix.cpack_gen }} -C Release

      # -----------------------------------------------------------------------
      # 7b. NSIS diagnostics on failure — most critical info printed FIRST
      #     so GitHub Actions UI truncation doesn't hide the actual error.
      # -----------------------------------------------------------------------
      - name: Show NSIS error log on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "build/_CPack_Packages/win64/NSIS/NSISOutput.log"

          # ── 1. Error lines only (the real error, shown first) ──────────────
          Write-Host "=== NSISOutput.log ERROR LINES ===" -ForegroundColor Red
          if (Test-Path $log) {
            Get-Content $log | Select-String -Pattern "(?i)error|!include|no such|can.t open|invalid" |
              Select-Object -Last 30 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "NSISOutput.log not found"
          }

          # ── 2. Absolute last 15 lines (error + surrounding context) ────────
          Write-Host "=== NSISOutput.log LAST 15 LINES ===" -ForegroundColor Yellow
          if (Test-Path $log) {
            Get-Content $log | Select-Object -Last 15
          }

          # ── 3. CPackConfig — what !include path was actually written ────────
          Write-Host "=== CPackConfig.cmake NSIS_EXTRA_*_COMMANDS ===" -ForegroundColor Cyan
          $cfg = "build/CPackConfig.cmake"
          if (Test-Path $cfg) {
            Get-Content $cfg | Select-String -Pattern "EXTRA_(UN)?INSTALL" -Context 0,2
          }

          # ── 4. Confirm the included .nsi files exist in the build dir ───────
          Write-Host "=== Included .nsi files in build/ ===" -ForegroundColor Cyan
          foreach ($f in @("build/nsis_install_commands.nsi","build/nsis_uninstall_commands.nsi")) {
            if (Test-Path $f) {
              Write-Host "FOUND $f — contents:"; Get-Content $f
            } else {
              Write-Host "MISSING: $f"
            }
          }

          # ── 5. project.nsi tail (last 40 lines, contains the !include calls) ─
          $nsi = "build/_CPack_Packages/win64/NSIS/project.nsi"
          if (Test-Path $nsi) {
            Write-Host "=== project.nsi LAST 40 LINES ===" -ForegroundColor Yellow
            Get-Content $nsi | Select-Object -Last 40
          }

      # -----------------------------------------------------------------------
      # 7c. Upload NSIS logs as artifact for full offline inspection
      # -----------------------------------------------------------------------
      - name: Upload NSIS logs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nsis-logs-windows
          path: |
            build/_CPack_Packages/win64/NSIS/NSISOutput.log
            build/_CPack_Packages/win64/NSIS/project.nsi
            build/CPackConfig.cmake
            build/nsis_install_commands.nsi
            build/nsis_uninstall_commands.nsi
          if-no-files-found: warn
          retention-days: 7

      # -----------------------------------------------------------------------
      # 8. Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: attach artifacts to GitHub Release when a tag is pushed
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
